<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love You Heart Animation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial,sans-serif;
}

#heart{
    position:relative;
    width:600px;
    height:600px;
}

.word{
    position:absolute;
    color:#ff9acb;
    font-size:20px;
    font-weight:bold;
    text-shadow:0 0 10px #fff;
    white-space:nowrap;
    animation:move 4s linear infinite;
}

@keyframes move{
    0%{
        transform:scale(0.5);
        opacity:0;
    }
    50%{
        opacity:1;
    }
    100%{
        transform:scale(1.2);
        opacity:0;
    }
}
</style>
</head>

<body>

<div id="heart"></div>

<script>

const heart=document.getElementById("heart");

for(let i=0;i<220;i++){

    let t=Math.random()*Math.PI*2;

    let x=16*Math.pow(Math.sin(t),3);

    let y=13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t);

    let span=document.createElement("span");

    span.className="word";
    span.innerHTML="I Love You";

    span.style.left=(x*16+250)+"px";
    span.style.top=(-y*16+220)+"px";

    span.style.animationDelay=(Math.random()*4)+"s";

    heart.appendChild(span);

}

</script>

</body>
</html>
